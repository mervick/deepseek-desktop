<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!--
      Content Security Policy (CSP)
      Security hardening to prevent XSS attacks.

      Directives:
      - default-src 'self': Only allow resources from same origin
      - script-src 'self': Scripts only from same origin
      - style-src 'self' 'unsafe-inline': Styles from same origin + inline (needed for React)
      - img-src 'self' data: https:: Images from same origin, data URIs, and HTTPS
      - font-src 'self': Fonts only from same origin
      - connect-src 'self' https://chat.deepseek.com https://*.deepseek.com: API calls to self and DeepSeek
      - frame-src https://chat.deepseek.com https://*.deepseek.com: iframes only from DeepSeek
    -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: https:;
                   font-src 'self' https://fonts.gstatic.com;
                   connect-src 'self' https://chat.deepseek.com https://*.deepseek.com;
                   frame-src https://chat.deepseek.com https://*.deepseek.com;"
        />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="DeepSeek Desktop - A private desktop wrapper for DeepSeek" />
        <title>DeepSeek Desktop</title>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/renderer/main.tsx"></script>
    </body>
</html>
